<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>我的天气应用</title>
<style>
body{
    font-family: Arial;
    text-align:center;
    margin-top:50px;
}
input{
    padding:10px;
}
button{
    padding:10px;
}
</style>
</head>
<body>

<h1>天气查询</h1>

<input id="city" placeholder="输入城市">

<button onclick="searchWeather()">
查询
</button>

<h2 id="result"></h2>

<script>
function searchWeather(){
    let city=document.getElementById("city").value;

    document.getElementById("result").innerHTML=
    city + "：天气晴朗 25°C";
}
</script>

</body>
</html>
